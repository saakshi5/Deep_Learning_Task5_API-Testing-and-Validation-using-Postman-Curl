<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Deep Learning Image Classifier</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>🧠 Deep Learning Image Classifier</h1>

    <p class="subtitle">
        Flask REST API • MobileNetV2 • ImageNet
    </p>

    <div class="card">

        <h2>Upload Image</h2>

        <form id="uploadForm">

            <input
                type="file"
                id="imageInput"
                accept=".jpg,.jpeg,.png"
                required>

            <button type="submit">
                Predict Image
            </button>

        </form>

        <div class="previewBox">

            <img id="preview">

        </div>

        <div id="result" class="result">

            <h3>Prediction Result</h3>

            <p>
                Upload an image and click Predict.
            </p>

        </div>

    </div>

</div>

<script>

const imageInput = document.getElementById("imageInput");

const preview = document.getElementById("preview");

const form = document.getElementById("uploadForm");


// Image Preview
imageInput.addEventListener("change", () => {

    const file = imageInput.files[0];

    if(file){

        preview.src = URL.createObjectURL(file);

        preview.style.display = "block";

    }

});


// Predict
form.addEventListener("submit", async(e)=>{

    e.preventDefault();

    const file = imageInput.files[0];

    const formData = new FormData();

    formData.append("file", file);

    document.getElementById("result").innerHTML = `
        <h3>Prediction Result</h3>
        <p>⏳ Predicting...</p>
    `;

    const response = await fetch("/predict",{

        method:"POST",

        body:formData

    });

    const data = await response.json();

    if(data.error){

        document.getElementById("result").innerHTML = `
            <h3>Error</h3>
            <p>${data.error}</p>
        `;

        return;

    }

    let html = `
        <h3>🏆 Predictions</h3>
    `;

    data.predictions.forEach((item,index)=>{

        html += `
        <div class="prediction-card">
            
            <div class="info">
                <h4>${item.class}</h4>
                <p>${item.confidence}% Confidence</p>
            </div>
        </div>
        `;

    });

    document.getElementById("result").innerHTML = html;

});

</script>

</body>

</html>
